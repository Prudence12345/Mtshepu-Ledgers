										<div class="form-container">
		<h2>Schedule a Free Consultation</h2> 
			<form action="https://formsubmit.co/222349506@edu.vut.ac.za" method="POST"> 
				<!-- FULL NAME --> 
				<label for="firstname">First Name</label>  
					<input type="text" id="firstname" name="First Name" placeholder="Enter your first name" minlength="2" maxlength="50" pattern="[A-Za-zÀ-ÿ' -]+" oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ' -]/g, '')" title="Please enter letters only." required >
				<!--LAST NAME-->
				<label for="lastname">Last Name</label> 
					<input type="text" id="lastname" name="Last Name" placeholder="Enter your last name" minlength="2" maxlength="50" title="Please enter letters only." pattern="[A-Za-zÀ-ÿ' -]+" oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ' -]/g, '')" title="Please enter letters only." required >
				<!--PHONE NUMBER-->
				<label for="phone">Phone Number:</label>
					<input type="tel" id="phone" name="phone" placeholder="Enter your phone number" inputmode="numeric" pattern="0[0-9]{9}" title="Phone number must begin with '0'"  minlength="10" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
				<!--EMAIL-->
				<label for="email">Email:</label>
					<input type="email" id="email" name="email" placeholder="Enter your email address" required>
					<!--CAPTCHA-->
					<input type="hidden" name="_captcha" value="true">
					<!--THANK YOU PAGE-->
					<input type="hidden" name="_next" value="Thank_You.html">
			<!--SUBMIT BUTTON-->
		<button type="submit">Submit</button>
		</form>

										</div>
